{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Login | Cake Princess{% endblock %}

{% block content %}
<section class="py-24 bg-cream min-h-screen flex items-center">
    <div class="max-w-md mx-auto w-full px-4">
        <div class="glass p-10 rounded-[2.5rem] shadow-2xl border border-gold-200/60" data-aos="fade-up">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center p-2 mb-4 rounded-2xl bg-black/90 border border-gold-400/40 shadow-md">
                    <img src="{% static 'images/logo.png' %}" alt="Cake Princess Logo" class="h-16 w-auto object-contain">
                </div>
                <h1 class="font-serif text-3xl font-bold text-charcoal">Welcome <span class="text-gold-600">Back</span></h1>
                <p class="text-gray-500 text-sm mt-2">Log in to your royalty account.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="w-full btn-premium text-white py-4 rounded-full font-bold mt-6 shadow-lg">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center text-sm">
                <p class="text-gray-500">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-gold-600 font-bold">Register here</a></p>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const passwordInputs = document.querySelectorAll('input[type="password"]');
    passwordInputs.forEach(input => {
        // Find parent that crispy forms creates or just wrap it
        const wrapper = document.createElement('div');
        wrapper.style.position = 'relative';
        wrapper.style.width = '100%';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.style.position = 'absolute';
        toggleBtn.style.right = '12px';
        toggleBtn.style.top = '50%';
        toggleBtn.style.transform = 'translateY(-50%)';
        toggleBtn.className = 'text-gray-400 hover:text-gold-600 focus:outline-none';
        
        const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
        const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>`;
        
        toggleBtn.innerHTML = eyeOpen;
        wrapper.appendChild(toggleBtn);

        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (input.type === 'password') {
                input.type = 'text';
                toggleBtn.innerHTML = eyeClosed;
            } else {
                input.type = 'password';
                toggleBtn.innerHTML = eyeOpen;
            }
        });
    });
});
</script>
{% endblock %}
